[package]
name = "polishd"
version = "0.1.0"
description = "System-wide text polisher"
authors = []
edition = "2021"

[lib]
name = "polishd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
arboard = "3"
enigo = { version = "0.2", features = ["x11rb"] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.22", default-features = false, features = ["tokio"] }
futures-util = "0.3"
x11rb = "0.13"
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
accessibility-sys = "0.1"
